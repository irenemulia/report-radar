name: Update site

# The website and its data are published to the gh-pages branch, which is rebuilt from scratch
# on every run. The data is never committed to main.

on:
  schedule:
    - cron: "0 1,7,13,19 * * *"   # four batches of companies a day (08:00, 14:00, 20:00, 02:00 Jakarta)
  workflow_dispatch:
    inputs:
      budget:
        description: Companies to analyse in this batch
        default: "3000"
  push:
    branches: [main]
    paths: ["docs/**", "pipeline/**", ".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Restore the data already published
        run: |
          if git fetch -q --depth=1 origin gh-pages 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/prev"
            git archive FETCH_HEAD data | tar -x -C "$RUNNER_TEMP/prev"
            rm -rf docs/data
            mv "$RUNNER_TEMP/prev/data" docs/data
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Analyse a batch of companies
        if: github.event_name != 'push'
        run: |
          pip install -q -r pipeline/requirements.txt
          python pipeline/build.py --budget "${{ inputs.budget || '3000' }}"
      - name: Rebuild the index only (code change, no new data)
        if: github.event_name == 'push'
        run: python pipeline/build.py --no-fetch
      - name: Publish
        run: |
          cd docs
          git init -q -b gh-pages
          git config user.name "report-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
